<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서·논술형 평가 연습실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFAF2; --card:#fff; --ink:#1F2F3B; --navy:#12314A; --teal:#168C88; --tealD:#0F716D; --tealL:#E6F3F2;
  --orange:#EF8B4D; --orangeD:#D9702F; --orangeL:#FDEEE3; --line:#ECE3D6; --line2:#D9CDBC; --muted:#6B7A84;
  --red:#CF4B3B; --redL:#FBEAE7; --green:#23905F; --greenL:#E7F5EE; --soft:#FAF6EF;
  --sh:0 1px 2px rgba(18,49,74,.04),0 6px 20px rgba(18,49,74,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;word-break:keep-all}
button{font-family:inherit;cursor:pointer;color:inherit}
.ic{width:18px;height:18px;flex:none}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(255,250,242,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.3px;border:none;background:none;padding:0;color:var(--ink)}
.brand .mk{width:32px;height:32px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center}
.brand .mk .ic{width:18px;height:18px}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
.narrow{max-width:760px;margin:0 auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:12px;border:1.5px solid transparent;font-size:15px;font-weight:700;background:var(--navy);color:#fff;transition:background .15s,border-color .15s,color .15s,transform .05s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.dot:focus-visible,.choice:focus-visible,.seg button:focus-visible{outline:3px solid rgba(22,140,136,.35);outline-offset:2px}
.btn.pri{background:var(--teal)} .btn.pri:hover{background:var(--tealD)}
.btn.acc{background:var(--orange)} .btn.acc:hover{background:var(--orangeD)}
.btn.line{background:#fff;color:var(--ink);border-color:var(--line2)} .btn.line:hover{border-color:var(--ink)}
.btn.ghost{background:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--ink);background:rgba(18,49,74,.06)}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.icon{width:42px;padding:0}
.btn.sm.icon{width:38px}
.btn.block{width:100%}
.btn.armed{background:var(--red)!important}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
.btn.line:disabled:hover{border-color:var(--line2)}

/* layout & text */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:var(--sh)}
h1{font-size:26px;letter-spacing:-.5px;margin:4px 0 20px}
h2{font-size:19px;letter-spacing:-.3px;margin:0 0 14px}
.lab{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
.muted{color:var(--muted)} .sm-t{font-size:13.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.grow{flex:1}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--tealL);color:var(--tealD);white-space:nowrap}
.tag .ic{width:14px;height:14px}
.tag.o{background:var(--orangeL);color:var(--orangeD)} .tag.n{background:#EDF0F3;color:var(--navy)}
.tag.r{background:var(--redL);color:var(--red)} .tag.g{background:var(--greenL);color:var(--green)}
.box{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px 18px;white-space:pre-wrap;font-size:16px}
.box.src{font-size:14px;line-height:1.75}
.box.white{background:#fff}
.box.model{background:var(--tealL);border-color:#CBE5E3}
.call{border-radius:12px;padding:12px 14px;font-size:14.5px;background:var(--orangeL);color:#6B3A1A;white-space:pre-wrap}
.call.ok{background:var(--greenL);color:#175C3D} .call.no{background:var(--redL);color:#7A2A20}
.call b{display:block;margin-bottom:3px;font-size:15px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:700;margin:22px 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* progress */
.stepbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar{flex:1;height:6px;background:#EFE7DA;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}
.cnt{font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}

/* home */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(max-width:820px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--sh);transition:transform .15s,border-color .15s;display:flex;flex-direction:column;gap:6px;min-height:200px}
.tile:hover{transform:translateY(-3px);border-color:var(--teal)}
.tile.o:hover{border-color:var(--orange)}
.tile .ib{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--tealL);color:var(--teal);margin-bottom:12px}
.tile .ib .ic{width:26px;height:26px}
.tile.o .ib{background:var(--orangeL);color:var(--orange)}
.tile h3{margin:0;font-size:20px;letter-spacing:-.4px}
.tile p{margin:0;color:var(--muted);font-size:14.5px}
.tile .tag{position:absolute;right:20px;top:24px}
.tile .go{position:absolute;right:22px;bottom:22px;color:var(--line2);transition:color .15s,transform .15s}
.tile:hover .go{color:var(--teal);transform:translateX(3px)}
.tile.o:hover .go{color:var(--orange)}
@media(max-width:820px){.tile{min-height:auto}}

/* inputs */
input[type=text],textarea{width:100%;font-family:inherit;font-size:16px;border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(22,140,136,.15)}
input::placeholder,textarea::placeholder{color:#A5ADB3}
textarea{min-height:100px;resize:vertical;line-height:1.6}
input.code{font-size:32px;font-weight:800;letter-spacing:14px;text-align:center;padding:12px;height:72px}
input.code::placeholder{letter-spacing:0;font-size:17px;font-weight:500}

/* choice (radio-like) */
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;font-size:15.5px;transition:border-color .15s,background .15s,opacity .15s}
.choice:hover:not(:disabled){border-color:var(--line2);background:var(--soft)}
.choice .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.choice.on{border-color:var(--teal);background:var(--tealL)}
.choice.on .rd{border-color:var(--teal)} .choice.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--teal)}
.choice .meta{font-size:13px;color:var(--muted);font-weight:500}
.choice .mark{margin-left:auto;display:none}
.choice.ok{border-color:var(--green);background:var(--greenL)} .choice.ok .rd{border-color:var(--green)} .choice.ok .mark{display:block;color:var(--green)}
.choice.no{border-color:var(--red);background:var(--redL)} .choice.no .rd{border-color:var(--red)} .choice.no .mark{display:block;color:var(--red)}
.choice.dim{opacity:.45}
.choice.picked .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.choice.picked.ok .rd{color:var(--green)} .choice.picked.no .rd{color:var(--red)}
.choice:disabled{cursor:default;color:inherit}

/* rubric table */
table.rb{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.rb th{background:var(--navy);color:#fff;font-weight:700;padding:9px 12px;text-align:left;font-size:13.5px}
table.rb th:first-child{text-align:center}
table.rb td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;white-space:pre-wrap;background:#fff}
table.rb td.pt{width:72px;text-align:center;font-weight:800;white-space:nowrap}
table.rb tr.target td{background:var(--orangeL)}
table.rb tr.target td.pt::after{content:"고칠 칸";display:block;font-size:11px;color:var(--orangeD);font-weight:800}

/* score options (participant) */
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line2)}
.opt .pt{flex:none;width:54px;height:40px;border-radius:10px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:17px}
.opt .tx{white-space:pre-wrap;font-size:15px;padding-top:7px}
.opt.on{border-color:var(--teal);background:var(--tealL)} .opt.on .pt{background:var(--teal);border-color:var(--teal);color:#fff}

/* answer dots */
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.dot:hover{border-color:var(--teal)}
.dot.done{background:var(--teal);border-color:var(--teal);color:#fff}
.dot.cur{box-shadow:0 0 0 3px rgba(22,140,136,.28);border-color:var(--teal);color:var(--teal)}
.dot.done.cur{color:#fff}
.ans{font-size:17px;line-height:1.8;padding:18px 20px;border-radius:14px;background:#fff;border:2px solid var(--teal);white-space:pre-wrap}

/* host */
.code-big{font-size:46px;font-weight:800;letter-spacing:8px;color:var(--teal);line-height:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:700}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.3px}
.stat .v small{font-size:14px;color:var(--muted);font-weight:700}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:none;background:transparent;padding:0 14px;height:38px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.acard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--sh)}
.acard.split{border-color:#EFBFB6;box-shadow:0 0 0 2px var(--redL)}
.acard .t{font-size:14.5px;white-space:pre-wrap;margin:8px 0 14px;color:#33434E}
.hb{display:grid;grid-template-columns:36px 1fr 20px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.hb .tr{height:12px;background:#F2ECE2;border-radius:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--teal);border-radius:6px;transition:width .3s}
.hb.gold .tr i{background:var(--orange)} .hb.gold>span:first-child{color:var(--orangeD);font-weight:800}
.hb b{text-align:right}

/* details */
details.more{margin-top:10px}
details.more>summary{list-style:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:4px 0;user-select:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.more[open]>summary::before{transform:rotate(45deg)}
details.more>summary:hover{color:var(--ink)}
details.more ul{margin:8px 0 0;padding-left:18px;font-size:14px}
details.more li{margin:4px 0}
details.card>summary{font-size:16px;color:var(--ink)}

/* 자료 */
.mat{position:relative;background:#fff;border:1.5px solid var(--line2);border-radius:14px;padding:26px 18px 16px;margin:6px 0 12px}
.mat-h{position:absolute;top:-11px;left:14px;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px}
.mat-svg{display:block;width:100%;max-width:460px;height:auto;margin:0 auto;font-family:inherit}
.mat-cap{text-align:center;font-weight:700;font-size:14.5px;margin-bottom:8px}
.mat-src{text-align:right;font-size:12px;color:var(--muted);margin-top:6px}
.mat-src::before{content:"출처: "}
.mat-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mat-tb{border-collapse:collapse;margin:0 auto;font-size:13.5px}
.mat-tb th,.mat-tb td{border:1px solid #CFC6B6;padding:5px 8px;text-align:center}
.mat-tb th{background:#F2EDE3}
.mat-news{font-size:14.5px;line-height:1.75}
.mat-paper,.mat-org{font-size:12px;color:var(--muted);border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:8px}
.mat-head{font-size:17px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
.mat-news p{margin:0 0 6px;text-indent:.6em}
.mat-notice ul{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.mat-text{font-size:14.5px;line-height:1.8}
.mat-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mat-cards div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.mat-stat{display:flex;align-items:center;gap:16px;justify-content:center;font-size:15px;font-weight:700}
.mat-big{font-size:42px;font-weight:800;color:#C0392B}
.mat-pics{display:flex;justify-content:space-around;gap:10px;text-align:center}
.mat-pics>div{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.mat-emo{font-size:34px;line-height:44px;height:44px;display:flex;align-items:center;justify-content:center}
.mat-pics span{font-size:13.5px;font-weight:700}
.mat-ans{display:flex;align-items:flex-end;gap:8px;margin-top:10px;font-size:15px}
.mat-ans span{flex:1;border-bottom:1.5px solid var(--ink);height:22px}
/* 서술 검토 */
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:15px;background:#fff}
.chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--teal);flex:none}
.chk:has(input:checked){border-color:var(--teal);background:var(--tealL)}
/* polish */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.pside{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;margin-bottom:0}
@media(max-width:900px){.pgrid{grid-template-columns:1fr}.pside{position:static;max-height:none;margin-bottom:16px}}
.sec{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:0 0 12px;color:var(--ink)}
mark.v{background:#FFD5BC;color:inherit;border-radius:4px;padding:0 2px}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys span{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;padding:5px 12px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;color:var(--muted);font-weight:500;transition:.15s}
.keys span.on{border-color:var(--green);background:var(--greenL);color:var(--green);font-weight:700}
.keys .ic{width:14px;height:14px;display:none} .keys span.on .ic{display:block}
.flag{font-size:13.5px;margin-top:8px;min-height:21px}

/* misc */
table.sum{width:100%;border-collapse:collapse;font-size:14.5px}
table.sum td,table.sum th{border-bottom:1px solid var(--line);padding:11px 6px;text-align:left;vertical-align:middle}
table.sum th{font-size:13px;color:var(--muted);font-weight:700}
.big-num{font-size:56px;font-weight:800;letter-spacing:-1px;color:var(--teal);line-height:1.1}
.big-ic{width:64px;height:64px;border-radius:50%;background:var(--tealL);color:var(--teal);display:grid;place-items:center;margin:0 auto 14px}
.big-ic .ic{width:32px;height:32px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.hidden{display:none!important}
@media(max-width:600px){.wrap{padding:20px 16px 64px}.top .in{padding:8px 16px}.card{padding:18px}h1{font-size:23px}.code-big{font-size:38px}}
</style>

};

const SETS = [
  {

  pyramid(year, vals) {

    </div>
  </div>`;
  $("create").onclick = () => createRoom(SETS[0].id);
  const reopen = async () => {
    const c = $("hostCode").value.trim();
    if (!/^\d{4}$/.test(c)) return toast("방 번호 4자리를 입력해 주세요.");
    const s = await getDoc(doc(db, "rooms", c)); if (!s.exists()) return toast("없는 방 번호입니다.");
    location.hash = "host/" + c;
  };

    const c = $("code").value.trim(); const n = $("name").value.trim();
    if (!/^\d{4}$/.test(c)) return toast("방 번호 4자리를 입력해 주세요.");
    if (!n) return toast("이름을 입력해 주세요.");
    try { const s = await getDoc(doc(db, "rooms", c)); if (!s.exists()) return toast("없는 방 번호입니다."); }
    catch (e) { console.error(e); return toast("연결에 실패했습니다."); }
    store("sl_name", n); location.hash = "play/" + c;
  };
  $("reopen").onclick = reopen; $("join").onclick = join;
  $("code").onkeydown = (e) => { if (e.key === "Enter") $("name").focus(); };
  $("name").onkeydown = (e) => { if (e.key === "Enter") join(); };
  $("hostCode").onkeydown = (e) => { if (e.key === "Enter") reopen(); };
}
async function createRoom(setId) {
  try {
    let code;
    for (let i = 0; i < 20; i++) { code = String(Math.floor(1000 + Math.random() * 9000)); const s = await getDoc(doc(db, "rooms", code)); if (!s.exists()) break; }
    await setDoc(doc(db, "rooms", code), { setId, round: 1, rubric: "v1", revealed: false, createdAt: serverTimestamp() });
    location.hash = "host/" + code;
  } catch (e) { console.error(e); toast("방을 만들지 못했습니다."); }
}

      const top = Math.max(0, ...Object.values(counts));

    };
    const r1 = $("round1"); if (r1) r1.onclick = () => updateDoc(doc(db, "rooms", code), { round: 1, rubric: "v1" });
  };
  unsubs.push(onSnapshot(doc(db, "rooms", code), (s) => { if (!s.exists()) { $app.innerHTML = msgCard("방을 찾을 수 없습니다"); return; } room = s.data(); if (!setById(room.setId)) { cleanup(); $app.innerHTML = msgCard("이전 버전의 방입니다", "새 방을 만들어 주세요."); return; } render(); }, (e) => { console.error(e); toast("연결 오류가 발생했습니다."); }));

// ---------- 참여자 화면: 한 장씩 채점 → 제출하고 다음 ----------
function playView(code) {
  const pid = myId(); const name = store("sl_name") || "참여자";
  $app.innerHTML = loading();
  let room = null, mine = {}, reasons = {}, idx = 0, done = false, pick = null, draft = "", curRound = null, showQ = false;
  const save = async () => {
    await setDoc(doc(db, "rooms", code, "scores", `${pid}_r${room.round}`), { pid, name, round: room.round, scores: mine, reasons, done, at: serverTimestamp() }, { merge: true });
  };
  const keepDraft = () => { const r = $("reason"); if (r) draft = r.value; };
  const openAnswer = (i) => { idx = i; done = false; pick = mine[i] !== undefined ? mine[i] : null; draft = reasons[i] || ""; render(); window.scrollTo(0, 0); };
  const render = () => {
    if (!room) return;
    const set = setById(room.setId); const N = set.answers.length;
    const submitted = Object.keys(mine).length;
    const v1 = room.rubric === "v1";
    const head = `
    <div class="card">
      <div class="row between"><div class="row" style="gap:6px"><span class="tag">${esc(name)}</span><span class="tag ${v1 ? "o" : "n"}">${room.round}차 · ${v1 ? "초안 기준표" : "다듬은 기준표"}</span></div>
        <span class="cnt">${submitted} / ${N} 제출</span></div>
      <h2 class="mt12">${esc(set.title)}</h2>
      <div class="dots">${set.answers.map((a, i) => `<button class="dot ${mine[i] !== undefined ? "done" : ""} ${!done && i === idx ? "cur" : ""}" data-go="${i}" aria-label="답안 ${i + 1}">${i + 1}</button>`).join("")}</div>
    </div>`;
    const bindDots = () => $app.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => openAnswer(+b.dataset.go)));
    if (done) {
      $app.innerHTML = `<div class="narrow">${head}
      <div class="card"><div class="row" style="gap:8px"><span class="tag g">${ic("check")}${room.round}차 제출 완료</span></div>
        <table class="sum mt12"><tr><th>답안</th><th>내 점수</th><th>근거</th><th></th></tr>
        ${set.answers.map((a, i) => `<tr><td>${i + 1}</td><td><b>${mine[i] !== undefined ? mine[i] + "점" : "–"}</b>${room.revealed ? ` <span class="tag o">기준 ${a.gold}점</span>` : ""}</td><td class="muted">${esc(reasons[i] || "")}</td><td style="text-align:right"><button class="btn ghost sm" data-edit="${i}">수정</button></td></tr>`).join("")}
        </table>
        ${room.revealed ? set.answers.map((a, i) => `<div class="call mt8"><b>답안 ${i + 1} · 기준 ${a.gold}점</b>${esc(a.why)}</div>`).join("") : ""}
      </div></div>`;
      $app.querySelectorAll("[data-edit]").forEach((b) => (b.onclick = () => openAnswer(+b.dataset.edit)));
      bindDots();
      return;
    }
    const a = set.answers[idx];
    $app.innerHTML = `<div class="narrow">${head}
    <div class="card"><div class="row between"><span class="lab" style="margin:0">문항</span><button class="btn line sm" id="toggleQ">${ic("doc")}${showQ ? "자료 접기" : "자료 보기"}</button></div>
      <div class="box mt8">${nl(set.question)}</div>${showQ ? `<div class="box src mt8">${nl(set.context)}</div>` : ""}</div>
    <div class="card">
      <div class="row between"><span class="lab" style="margin:0">학생 답안 ${idx + 1}</span>${mine[idx] !== undefined ? `<span class="tag g">${ic("check")}${mine[idx]}점 제출함</span>` : ""}</div>
      <div class="ans mt8">${nl(a.text)}</div>
      <div class="lab mt20">점수</div>
      ${set.rubric[room.rubric].map(([p, t]) => `<button class="opt ${pick === p ? "on" : ""}" data-p="${p}"><span class="pt">${p}점</span><span class="tx">${nl(t)}</span></button>`).join("")}
      ${room.rubric === "v2" && set.v2note ? `<div class="call mt8" style="font-size:14px">${nl(set.v2note)}</div>` : ""}
      <textarea id="reason" class="mt8" maxlength="120" placeholder="채점 근거 (선택)" style="min-height:64px">${esc(draft)}</textarea>
      ${room.revealed && mine[idx] !== undefined ? `<div class="call mt12"><b>기준 점수 ${a.gold}점</b>${esc(a.why)}</div>` : ""}
      ${room.revealed && room.round === 1 ? `<details class="more"><summary>초안 기준표의 문제점</summary><ul>${set.issues.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
      <div class="row between mt16">
        <button class="btn line" id="prev" ${idx === 0 ? "disabled" : ""}>${ic("arrowL")}이전</button>
        <button class="btn pri" id="submit" ${pick === null ? "disabled" : ""}>${Object.keys(mine).filter((k) => +k !== idx).length === N - 1 ? "제출하고 마치기" : "제출하고 다음"}${ic("arrowR")}</button>
      </div></div></div>`;
    $app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => { pick = +b.dataset.p; keepDraft(); render(); }));
    $("reason").oninput = (e) => { draft = e.target.value; };
    $("prev").onclick = () => openAnswer(idx - 1);
    $("toggleQ").onclick = () => { showQ = !showQ; keepDraft(); render(); };
    bindDots();
    $("submit").onclick = async () => {
      if (pick === null) return;
      keepDraft();
      mine[idx] = pick; reasons[idx] = draft.trim();
      const nextIdx = set.answers.findIndex((x, i) => i > idx && mine[i] === undefined);
      const firstMissing = set.answers.findIndex((x, i) => mine[i] === undefined);
      done = firstMissing === -1;
      try { await save(); } catch (e) {
        console.error(e); delete mine[idx]; done = false;
        toast(e && e.code === "permission-denied" ? "저장 권한이 없습니다. Firestore 규칙을 확인해 주세요." : "저장에 실패했습니다. 다시 눌러 주세요.");
        return;
      }
      if (done) { render(); window.scrollTo(0, 0); }
      else openAnswer(nextIdx !== -1 ? nextIdx : firstMissing);
    };
  };
  unsubs.push(onSnapshot(doc(db, "rooms", code), async (s) => {
    if (!s.exists()) { $app.innerHTML = msgCard("방을 찾을 수 없습니다"); return; }
    keepDraft();
    room = s.data();
    if (!setById(room.setId)) { cleanup(); $app.innerHTML = msgCard("이전 버전의 방입니다", "새 방 번호를 확인해 주세요."); return; }
    if (room.round !== curRound) {
      curRound = room.round; mine = {}; reasons = {}; idx = 0; done = false; pick = null; draft = "";
      const my = await getDoc(doc(db, "rooms", code, "scores", `${pid}_r${room.round}`));

        done = !!d.done;
        const N = setById(room.setId).answers.length;
        const fm = [...Array(N).keys()].find((i) => mine[i] === undefined);
        if (!done) { idx = fm === undefined ? 0 : fm; pick = mine[idx] !== undefined ? mine[idx] : null; draft = reasons[idx] || ""; }
      }
    }
    render();
  }, (e) => { console.error(e); toast("연결 오류가 발생했습니다."); }));
}

}

    $app.innerHTML = `<div class="narrow">
    <div class="stepbar"><span class="tag g">${ic("check")}${correct}</span><div class="bar"><i style="width:${(pos / total) * 100}%"></i></div><span class="cnt">${pos + 1} / ${total}</span></div>

      $("result").innerHTML = `
        <div class="lab mt16">검토 예시 · 내 의견에 있는 것에 표시하세요</div>

        <div class="lab mt16">수정 예시</div><div class="box model">${nl(c.fix)}</div>
        <div class="row end mt16"><button class="btn pri" id="next">${pos === total - 1 ? "결과 보기" : "다음"}${ic("arrowR")}</button></div>`;
      $("next").onclick = () => {
        const got = $app.querySelectorAll("#pts input:checked").length; const r = rec["종합"] || [0, 0];
        clinic(order, pos + 1, correct, { ...rec, 종합: [r[0] + got, r[1] + c.points.length] }); window.scrollTo(0, 0);
      };
    };
    return;
  }
  $app.innerHTML = `<div class="narrow">
    <div class="stepbar"><span class="tag g">${ic("check")}${correct}</span><div class="bar"><i style="width:${(pos / total) * 100}%"></i></div><span class="cnt">${pos + 1} / ${total}</span></div>
    <div class="card">

      <div class="mt16" id="opts">${opts.map((k) => `<button class="choice" data-k="${k}"><span class="rd"></span><span>${esc(TYPES[k])}</span><span class="mark">${ic(k === c.ans ? "check" : "x")}</span></button>`).join("")}</div>
      <div id="result"></div>
    </div></div>`;
  $app.querySelectorAll("#opts .choice").forEach((b) => (b.onclick = () => {
    const ok = b.dataset.k === c.ans; const area = c.area || "내용";
    $app.querySelectorAll("#opts .choice").forEach((x) => {

const PEER_LIMIT = 8 * 1024 * 1024;  // PDF 최대 8 MiB; 큰 사진은 자동 축소
const PEER_CHUNK_SIZE = 256 * 1024;  // Firestore 문서당 최대 1 MiB 미만
const PEER_MAX_CHUNKS = Math.ceil(PEER_LIMIT / PEER_CHUNK_SIZE);
const PEER_TYPES = new Set(["application/pdf", "image/jpeg", "image/png", "image/webp"]);
let peerReady = null, peerUser = null, peerCleanup = null;
let pdfjsPromise = null, pdfLibPromise = null;
const peerUid = () => peerUser && peerUser.uid;
const peerErr = (e) => {
  console.error("합평 오류", e);
  const c = (e && e.code) || "";
  if (c.includes("permission-denied") || c.includes("unauthorized")) return "접근 권한이 없습니다. Firebase 보안 규칙과 익명 로그인을 확인해 주세요.";
  if (c.includes("resource-exhausted")) return "Firestore 무료 할당량 또는 파일 용량 한도에 도달했습니다. 다른 날 시도하거나 관리자에게 문의해 주세요.";
  if (c.includes("network")) return "네트워크 연결을 확인해 주세요.";
  return (e && e.message && e.message.slice(0, 110)) || "처리 중 오류가 발생했습니다.";
};
async function peerConnect() {
  await fbReady;
  if (!db || !firebaseApp) throw new Error("Firebase 연결을 확인해 주세요.");
  if (!peerReady) peerReady = (async () => {
    const am = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const auth = am.getAuth(firebaseApp);
    await auth.authStateReady();
    if (!auth.currentUser) await am.signInAnonymously(auth);
    peerUser = auth.currentUser;
    if (!peerUser) throw new Error("익명 로그인에 실패했습니다.");
  })();
  return peerReady;
}

}

  async function getFileBytes(f){
    if(state.bytesCache.has(f.id))return state.bytesCache.get(f.id);
    if(f.storageMode!=="firestoreChunks") throw new Error("이 문항은 이전 Storage 방식으로 저장되었습니다. 무료 버전에서 다시 업로드해 주세요.");
    const snap=await getDocs(peerChunks(code,f.id));
    if(snap.size!==f.chunkCount || f.chunkCount<1 || f.chunkCount>PEER_MAX_CHUNKS)
      throw new Error("파일 일부가 누락되었습니다. 문항을 다시 업로드해 주세요.");
    const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.index-b.index);
    const result=new Uint8Array(f.size);
    let pos=0;
    for(let i=0;i<rows.length;i++){
      const part=rows[i];
      if(part.index!==i || !part.data || typeof part.data.toUint8Array!=="function")
        throw new Error("파일 조각 순서가 잘못되었습니다.");
      const partBytes=part.data.toUint8Array();
      if(partBytes.length<1 || partBytes.length>PEER_CHUNK_SIZE || pos+partBytes.length>result.length)
        throw new Error("파일 데이터가 손상되었습니다.");
      result.set(partBytes,pos);pos+=partBytes.length;
    }
    if(pos!==result.length)throw new Error("파일 크기가 일치하지 않습니다.");
    state.bytesCache.set(f.id,result);
    return result;
  }

    }else if(!confirm("남아 있는 합평 자료의 삭제를 다시 진행하시겠습니까?"))return;
    state.deleting=true;
    const btn=$("peerEndRoom"), progress=$("peerDeleteStatus");
    btn.disabled=true;
    try{
      if(isOpen()) await updateDoc(peerRoomRef(code),{status:"closing"});
      progress.textContent="자료 목록을 확인하는 중…";
      // 진행 중 중단되어도 다시 시작해 남은 자료를 지울 수 있습니다.
      const allDocs=await getDocs(peerDocs(code));

      const peopleSnap=await getDocs(collection(db,"peerRooms",code,"participants"));

      // 방장 참여자 문서는 삭제 재시도를 위한 마지막 접근 열쇠입니다.
      // 방 자체와 같은 원자적 배치로 맨 마지막에 삭제해야, 중간 실패 시 재시작할 수 있습니다.
      for(const person of peopleSnap.docs) if(person.id !== peerUid())refs.push(person.ref);
      // 각 배치의 룰 검사 get() 호출 제한을 고려하여 10건 단위로 처리합니다.
      for(let i=0;i<refs.length;i+=10){
        const batch=writeBatch(db);
        for(const ref of refs.slice(i,i+10))batch.delete(ref);
        await batch.commit();
        progress.textContent=`전체 자료 삭제 중… ${Math.min(i+10,refs.length)} / ${refs.length}건`;
      }
      // 최종 확인: 네트워크 오류 등으로 자료가 남은 경우 방은 유지하여 재시도 가능.
      const remain=await Promise.all([
        getDocs(peerDocs(code)),
        getDocs(peerComments(code)),
        getDocs(collection(db,"peerRooms",code,"participants"))
      ]);
      if(remain[0].size || remain[1].size || remain[2].docs.some(p=>p.id!==peerUid()))
        throw new Error("삭제되지 않은 자료가 발견되었습니다. 다시 마무리해 주세요.");
      // 방장 참여자와 방 문서를 함께 지워 둘 중 하나만 남는 상태를 막습니다.
      const finalBatch=writeBatch(db);
      if(remain[2].docs.some(p=>p.id===peerUid())) finalBatch.delete(peerPersonRef(code));
      finalBatch.delete(peerRoomRef(code));
      await finalBatch.commit();
      state.closed=true;
      toast("합평방의 문항·파일·피드백·참여자 정보 삭제를 완료했습니다.");
      location.hash="peer";
    }catch(e){
      console.error("합평방 삭제 실패",e);
      progress.textContent="삭제가 중단되었습니다. 아래 버튼으로 삭제 마무리를 다시 실행해 주세요. "+peerErr(e);
      toast("삭제가 일부 완료되지 않았습니다. 다시 실행해 주세요.");
    }finally{
      state.deleting=false;
      if(btn)btn.disabled=false;
    }
  }
  async function saveFeedback(){
    const f=activeDoc(), draft=state.draft, name=peerName();
    if(!isOpen()||!f||!draft||f.ownerUid===peerUid())return;
    if(!peerText(draft.text,2000))return toast("피드백 내용을 적어주세요.");
    const button=$("peerSaveNote");if(button)button.disabled=true;
    try{
      const nr=doc(peerComments(code));
      await setDoc(nr,{documentId:f.id,authorUid:peerUid(),authorName:name,page:draft.page,x:draft.x,y:draft.y,
        text:peerText(draft.text,2000),createdAt:serverTimestamp()});
      state.draft=null;state.focused=nr.id;renderNotes();renderMarkers();toast("피드백을 등록했습니다.");
    }catch(e){toast(peerErr(e));if(button)button.disabled=false;}
  }
  // 사진은 크기에 관계없이 브라우저 Canvas로 다시 인코딩해 EXIF 등 위치 메타데이터를 제거합니다.
  // PDF는 텍스트 품질을 보존하기 위해 원본 바이트를 사용하므로 작성자가 문서 속성을 확인해야 합니다.
  async function preparePeerFile(file,mime){
    if(file.size===0)throw new Error("빈 파일은 올릴 수 없습니다.");
    if(mime==="application/pdf"){
      if(file.size>PEER_LIMIT)throw new Error("PDF는 최대 8MB까지 가능합니다. PDF를 압축하거나 나누어 올려주세요.");
      return {bytes:new Uint8Array(await file.arrayBuffer()),mime};
    }
    const img=await new Promise((resolve,reject)=>{
      const im=new Image(),url=URL.createObjectURL(file);
      im.onload=()=>{URL.revokeObjectURL(url);resolve(im);};
      im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("사진을 열 수 없습니다."));};
      im.src=url;
    });
    const ratio=Math.min(1,2600/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    let output=null;
    for(const quality of [.94,.88,.8,.7,.6,.5]){
      output=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",quality));
      if(output&&output.size<=PEER_LIMIT)break;
    }
    if(!output||output.size>PEER_LIMIT)throw new Error("사진 용량을 줄이지 못했습니다. 더 작은 사진을 선택해 주세요.");
    return {bytes:new Uint8Array(await output.arrayBuffer()),mime:"image/jpeg"};
  }
  async function uploadFile(){
    if(state.uploading)return;
    if(!isOpen())return toast("연수가 종료 중이므로 업로드할 수 없습니다.");
    const file=state.cameraFile||$("peerFile").files[0];if(!file)return toast("PDF나 사진 파일을 선택해 주세요.");
    const incomingMime=peerMime(file);
    if(!PEER_TYPES.has(incomingMime))return toast("PDF, JPG, PNG 또는 WEBP 파일만 올릴 수 있습니다.");
    const title=peerText($("peerFileTitle").value,80)||peerText(file.name.replace(/\.[^.]+$/,""),80)||"새 문항";
    const docRef=doc(peerDocs(code));
    const chunksRef=peerChunks(code,docRef.id);
    const written=[];
    let metadataCreated=false;
    state.uploading=true;$("peerUpload").disabled=true;$("peerUploadProgress").classList.remove("hidden");
    $("peerUploadStatus").textContent="업로드할 파일 준비 중…";
    try{
      const {bytes,mime}=await preparePeerFile(file,incomingMime);
      const chunkCount=Math.ceil(bytes.length/PEER_CHUNK_SIZE);
      if(chunkCount<1||chunkCount>PEER_MAX_CHUNKS)throw new Error("파일이 무료 저장 한도를 초과했습니다.");
      await setDoc(docRef,{ownerUid:peerUid(),ownerName:peerName(),title,fileName:peerText(file.name,120),
        mime,storageMode:"firestoreChunks",chunkCount,size:bytes.length,status:"uploading",createdAt:serverTimestamp()});
      metadataCreated=true;
      for(let i=0;i<chunkCount;i++){
        if(!isOpen())throw new Error("방이 종료되어 업로드를 중단했습니다.");
        const slice=bytes.subarray(i*PEER_CHUNK_SIZE,Math.min(bytes.length,(i+1)*PEER_CHUNK_SIZE));
        const partRef=doc(chunksRef,String(i).padStart(3,"0"));
        await setDoc(partRef,{ownerUid:peerUid(),index:i,data:Bytes.fromUint8Array(slice)});
        written.push(partRef);
        const pct=Math.round((i+1)/chunkCount*95);
        $("peerUploadStatus").textContent=`Firestore에 저장 중… ${pct}% (${i+1}/${chunkCount}조각)`;
        $("peerUploadProgress").firstElementChild.style.width=pct+"%";
      }
      await updateDoc(docRef,{status:"ready"});
      state.bytesCache.set(docRef.id,bytes);
      $("peerUploadProgress").firstElementChild.style.width="100%";
      $("peerFile").value="";$("peerCamera").value="";state.cameraFile=null;$("peerFileTitle").value="";
      $("peerUploadStatus").textContent="업로드 완료! 다른 선생님들에게 문항이 표시됩니다.";
      toast("문항을 올렸습니다.");
      await selectFile(docRef.id);
    }catch(e){
      // 미완료 업로드의 조각만 삭제합니다. 정상 문항은 마지막에 생성되므로 다른 사람에게 표시되지 않습니다.
      for(const partRef of written)await deleteDoc(partRef).catch(err=>console.warn("업로드 정리 실패",err));
      if(metadataCreated)await deleteDoc(docRef).catch(err=>console.warn("업로드 문서 정리 실패",err));
      $("peerUploadStatus").textContent=peerErr(e);toast("문항 업로드를 확인해 주세요.");
    }finally{
      state.uploading=false;$("peerUpload").disabled=false;$("peerUploadProgress").classList.add("hidden");
      $("peerUploadProgress").firstElementChild.style.width="0";
    }
  }
  // 브라우저의 한글 폰트로 텍스트를 그려 PDF에 이미지 형태로 넣으므로 별도 폰트 파일이 필요 없습니다.
  async function exportPdf(){
    const f=activeDoc();if(!f||f.ownerUid!==peerUid())return toast("본인이 올린 문항만 내려받을 수 있습니다.");
    const button=$("peerExport");button.disabled=true;button.textContent="PDF 만드는 중…";
    try{
      const bytes=await getFileBytes(f);
      const {PDFDocument,StandardFonts,rgb}=await peerPdfLib();
      let pdf;
      if(f.mime==="application/pdf") pdf=await PDFDocument.load(bytes.slice(0));
      else{
        pdf=await PDFDocument.create();
        let image;
        if(f.mime==="image/jpeg")image=await pdf.embedJpg(bytes.slice(0));
        else if(f.mime==="image/png")image=await pdf.embedPng(bytes.slice(0));
        else{
          const img=new Image(), url=URL.createObjectURL(new Blob([bytes],{type:f.mime}));
          try{
            await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
            const c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;
            c.getContext("2d").drawImage(img,0,0);image=await pdf.embedPng(await (await fetch(c.toDataURL("image/png"))).arrayBuffer());
          }finally{URL.revokeObjectURL(url);}
        }
        const p=pdf.addPage([595.28,841.89]), k=Math.min(555/image.width,790/image.height);
        p.drawImage(image,{x:(595.28-image.width*k)/2,y:(841.89-image.height*k)/2,width:image.width*k,height:image.height*k});
        stateExportImgSize={w:image.width*k,h:image.height*k};
      }
      const all=currentNotes();
      const font=await pdf.embedFont(StandardFonts.HelveticaBold);
      const pageCount=pdf.getPageCount();
      for(let i=0;i<pageCount;i++){
        const page=pdf.getPage(i);const {width,height}=page.getSize();
        all.filter(n=>n.page===i+1).forEach(n=>{
          const num=noteIndex(n),cx=n.x*width,cy=(1-n.y)*height;
          // 사진 파일은 A4에 여백을 두고 배치하므로 핀도 사진 영역을 기준으로 배치
          const px=f.mime==="application/pdf"?cx:((width-embeddedWidth())/2+n.x*embeddedWidth());
          const py=f.mime==="application/pdf"?cy:((height-embeddedHeight())/2+(1-n.y)*embeddedHeight());
          page.drawCircle({x:px,y:py,size:11,color:rgb(.08,.55,.53),borderColor:rgb(1,1,1),borderWidth:1});
          const label=String(num),size=num>99?8:10;
          page.drawText(label,{x:px-font.widthOfTextAtSize(label,size)/2,y:py-3.5,size,font,color:rgb(1,1,1)});
        });
      }
      function embeddedWidth(){
        // JPEG/PNG/WEBP의 이미지 크기는 페이지의 최대 표시 영역에 맞게 계산합니다.
        return stateExportImgSize?.w || 555;
      }
      function embeddedHeight(){return stateExportImgSize?.h || 790;}
      // 뒤쪽에 작성자별 의견 전체 목록 첨부 (방장의 현재 표시 필터와 무관)
      const info = all.map(n=>({index:noteIndex(n),page:n.page,name:n.authorName,time:dateText(n),text:n.text}));
      await appendKoreanCommentPages(pdf,{title:f.title,owner:f.ownerName,code,notes:info});
      const blob=new Blob([await pdf.save()],{type:"application/pdf"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      a.download=`합평결과_${f.title.replace(/[\\/:*?"<>|]/g,"_").slice(0,45)}.pdf`;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
      toast("모든 피드백이 포함된 PDF를 생성했습니다.");
    }catch(e){console.error(e);toast("PDF 생성에 실패했습니다. 암호화된 PDF 또는 파일 형식을 확인해 주세요.");}
    finally{button.disabled=false;button.innerHTML=`${ic("doc")}피드백 PDF 다운로드`;}
  }
  let stateExportImgSize=null;
  async function appendKoreanCommentPages(pdf, data){
    const W=1190,H=1684, left=88, right=1102, top=110, bottom=1580;
    let canvas,ctx,y,pg=0;
    async function flush(){
      if(!canvas)return;
      const png=await pdf.embedPng(canvas.toDataURL("image/png"));
      pdf.addPage([595,842]).drawImage(png,{x:0,y:0,width:595,height:842});
    }
    async function fresh(){
      if(canvas)await flush();
      pg++;canvas=document.createElement("canvas");canvas.width=W;canvas.height=H;ctx=canvas.getContext("2d");
      ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.fillStyle="#168C88";ctx.fillRect(0,0,W,16);
      ctx.fillStyle="#162F43";ctx.font="bold 48px 'Noto Sans KR',sans-serif";ctx.fillText("서·논술형 평가 문항 합평 기록",left,top);
      ctx.fillStyle="#546775";ctx.font="28px 'Noto Sans KR',sans-serif";
      ctx.fillText(`문항: ${data.title.slice(0,32)}  |  올린 사람: ${data.owner.slice(0,15)}`,left,top+54);
      ctx.fillText(`방 번호: ${data.code}  ·  총 피드백 ${data.notes.length}건  ·  기록 ${pg}쪽`,left,top+97);
      ctx.strokeStyle="#DFE9EA";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(left,top+122);ctx.lineTo(right,top+122);ctx.stroke();
      y=top+174;
    }
    const wrapLines = (str, maxWidth) => {
      const lines=[];const parts=String(str).replace(/\r/g,"").split("\n");
      for(const paragraph of parts){
        if(!paragraph){lines.push("");continue;}
        let line="";
        for(const ch of paragraph){
          if(ctx.measureText(line+ch).width>maxWidth&&line){lines.push(line);line=ch;}else line+=ch;
        }
        lines.push(line);
      }
      return lines;
    };
    await fresh();
    if(!data.notes.length){ctx.fillStyle="#526571";ctx.font="32px 'Noto Sans KR',sans-serif";ctx.fillText("등록된 피드백이 없습니다.",left,y+30);}
    for(const n of data.notes){
      if(y>bottom-160)await fresh();
      ctx.fillStyle="#E6F3F2";ctx.fillRect(left,y-34,right-left,64);
      ctx.fillStyle="#126D69";ctx.font="bold 29px 'Noto Sans KR',sans-serif";
      ctx.fillText(`[${n.index}] ${n.page}쪽 · ${n.name.slice(0,18)}`,left+16,y+8);
      ctx.fillStyle="#78868B";ctx.font="24px 'Noto Sans KR',sans-serif";
      ctx.fillText(n.time,right-ctx.measureText(n.time).width-16,y+7);
      y+=75;
      ctx.font="29px 'Noto Sans KR',sans-serif";
      const lines=wrapLines(n.text,right-left-38);
      for(const line of lines){
        if(y>bottom-50)await fresh();
        ctx.fillStyle="#253949";ctx.fillText(line,left+18,y);y+=45;
      }
      y+=40;
    }
    await flush();
  }
  // 구독 중인 결과가 현재 화면에 반영되도록 유지
  unsubs.push(onSnapshot(peerPersonRef(code),snap=>{
    if(state.closed)return;
    if(!snap.exists()||snap.data().status!=="approved"){
      route();
    }
  },e=>{if(!state.closed)toast(peerErr(e));}));
  unsubs.push(onSnapshot(peerRoomRef(code),s=>{
    if(!s.exists()){ if(!state.closed){cleanup(); $app.innerHTML=msgCard("합평이 종료되었습니다", "방장에 의해 등록된 문항과 피드백이 삭제되었습니다.");}return; }
    state.room=s.data();if(state.closed)return;
    if(state.room.status==="closing" && !isHost()){
      cleanup(); $app.innerHTML=msgCard("합평이 종료되는 중입니다", "방장이 자료를 삭제하고 있습니다. 더 이상 문항을 열람할 수 없습니다.");return;
    }
    updateHeader();renderNotes();renderMarkers();
  },e=>toast(peerErr(e))));
  unsubs.push(onSnapshot(collection(db,"peerRooms",code,"participants"),ss=>{
    state.people=ss.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name,"ko"));
    if(state.closed)return;updateHeader();
  },e=>toast(peerErr(e))));
  unsubs.push(onSnapshot(peerDocs(code),ss=>{
    state.docs=ss.docs.map(d=>({id:d.id,...d.data()})).filter(f=>f.status!=="uploading").sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    if(state.closed)return;
    if(!state.activeId && state.docs.length)selectFile(state.docs[0].id);
    else if(state.activeId && !state.docs.find(d=>d.id===state.activeId)) {state.activeId=null;clearPaper("문항을 선택해 주세요.");}
    updateFileBar();updateToolbar();renderNotes();
  },e=>toast(peerErr(e))));
  unsubs.push(onSnapshot(peerComments(code),ss=>{
    state.notes=ss.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
    if(state.closed)return;
    updateFileBar();renderNotes();renderMarkers();
  },e=>toast(peerErr(e))));
}

// =====================================================================
// 라우터
// =====================================================================
async function route() {
  cleanup();
  if (peerCleanup) { peerCleanup(); peerCleanup = null; }
  const h = location.hash.replace(/^#/, "");
  const [m, arg] = h.split("/");
  $("homeBtn").classList.toggle("hidden", !m);
  if (["room", "host", "play", "peer", "peerroom"].includes(m)) {
    $app.innerHTML = loading();
    await fbReady;
    if (!needDb()) return;
  }
  if (m === "peer") peerEntry();
  else if (m === "peerroom" && arg) peerRoomView(arg);
  else if (m === "room") roomEntry();
  else if (m === "host" && arg) hostView(arg);
  else if (m === "play" && arg) playView(arg);
  else if (m === "clinic") clinicStart();
  else if (m === "polish") polish();
  else home();
  window.scrollTo(0, 0);
}
route();
</script>
